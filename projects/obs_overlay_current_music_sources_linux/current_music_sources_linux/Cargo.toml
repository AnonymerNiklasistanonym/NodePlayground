[package]
name = "current_music_sources_linux"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
lofty = "0.25.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
urlencoding = "2.1.3"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
zbus = "5.19.0"
